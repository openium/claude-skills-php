name: <project>

x-app-env: &app-env
    APP_ENV: ${APP_ENV:-dev}
    DATABASE_HOST: database
    DATABASE_PORT: 3306
    DATABASE_NAME: ${DATABASE_NAME:-<project>}
    DATABASE_USER: ${DATABASE_USER:-user}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
    MAILER_TRANSPORT: smtp
    MAILER_HOST: mailpit
    MAILER_PORT: 1025
    MAILER_USER: 'no-reply@<project>.local'
    MAILER_PASSWORD: ''
    MAILER_ENCRYPTION: ''
    MAILER_AUTH_MODE: ''
    # Remove if the project has no async Messenger transport.
    MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages

services:
    php:
        image: <project>-php:dev
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: dev
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        environment:
            <<: *app-env
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
        volumes:
            - ./:/var/www/html:cached
            - <project>_vendor:/var/www/html/vendor
        depends_on:
            database:
                condition: service_healthy
            # Remove if Redis is not used.
            redis:
                condition: service_healthy
        # Optional: only if logs are shipped to a central ELK/Filebeat stack (see "Optional Extras").
        # labels:
        #     - "<project>_ship_logs=true"

    nginx:
        image: nginx:1.27-alpine
        depends_on:
            - php
        ports:
            - "8080:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    database:
        # Swap for postgres:<version>-alpine if the project uses PostgreSQL; adjust healthcheck accordingly.
        image: mariadb:10.11
        environment:
            MARIADB_DATABASE: ${DATABASE_NAME:-<project>}
            MARIADB_USER: ${DATABASE_USER:-user}
            MARIADB_PASSWORD: ${DATABASE_PASSWORD:-password}
            MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
            - "3307:3306"
        volumes:
            - <project>_db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10

    # --- Optional: only if the project uses Redis (cache, sessions, or Messenger transport) ---
    redis:
        image: redis:7-alpine
        volumes:
            - <project>_redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    # --- Optional: only if the project uses an async Messenger transport ---
    messenger-worker:
        image: <project>-php:dev
        depends_on:
            php:
                condition: service_started
            redis:
                condition: service_healthy
        environment:
            <<: *app-env
        volumes:
            - ./:/var/www/html:cached
            - <project>_vendor:/var/www/html/vendor
        restart: unless-stopped
        command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M", "-vv"]

    # --- Optional: local outgoing mail capture ---
    mailpit:
        image: axllent/mailpit:v1.20
        ports:
            - "8025:8025"

    # --- Optional: only if the project ships logs to a shared ELK/Filebeat stack.
    #     Requires the "<project>_ship_logs=true" label on the services to collect (see above)
    #     and an external network shared with the Logstash/ELK stack. ---
    # filebeat:
    #     image: docker.elastic.co/beats/filebeat:9.4.4
    #     user: root
    #     command: ["--strict.perms=false"]
    #     volumes:
    #         - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    #         - /var/lib/docker/containers:/var/lib/docker/containers:ro
    #         - /var/run/docker.sock:/var/run/docker.sock:ro
    #         - <project>_filebeat_data:/usr/share/filebeat/data
    #     networks:
    #         - elk-local_elk
    #     restart: unless-stopped

volumes:
    <project>_db_data:
    <project>_vendor:
    # Remove if Redis is not used.
    <project>_redis_data:
    # <project>_filebeat_data:

